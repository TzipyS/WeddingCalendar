<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="body-red" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="45%" stop-color="#e83333"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="body-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="label-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4a3"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="gold-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="50%" stop-color="#ffe566"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- pull string -->
    <path d="M58 18 C52 8, 44 2, 38 0" stroke="#f8f8f8" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 18 C64 8, 72 2, 78 0" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- neck -->
    <rect x="46" y="22" width="28" height="18" rx="4" fill="#c62828"/>
    <rect x="44" y="36" width="32" height="10" rx="3" fill="url(#gold-band)"/>

    <!-- nozzle opening -->
    <ellipse cx="60" cy="22" rx="10" ry="5" fill="#333"/>
    <ellipse cx="60" cy="21" rx="6" ry="2.5" fill="#111"/>

    <!-- bottle body -->
    <path d="M38 48 Q34 90, 36 130 Q38 168, 48 182 Q60 192, 72 182 Q82 168, 84 130 Q86 90, 82 48 Z" fill="url(#body-red)"/>
    <path d="M38 48 Q34 90, 36 130 Q38 168, 48 182 Q60 192, 72 182 Q82 168, 84 130 Q86 90, 82 48 Z" fill="url(#body-shine)"/>

    <!-- label -->
    <rect x="36" y="88" width="48" height="52" rx="6" fill="url(#label-bg)" stroke="#e65100" stroke-width="1.5"/>
    <text x="60" y="108" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#e53935">PARTY</text>
    <text x="60" y="124" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#1565c0">POPPER</text>
    <text x="60" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#555">  </text>
  </g>
</svg>
